project:
  type: website
  output-dir: _site

website:
  title: "Zeeshan Ahmed"
  description: >-
    Zeeshan Ahmed builds ultra-low-noise superconducting detectors and the readout
    systems that make them usable at scale, and uses them to study the first instant
    of the Universe and the growth of cosmic structure.
  site-url: https://zeeshahmed.github.io
  favicon: images/favicon.svg
  navbar:
    title: "Zeeshan Ahmed"
    pinned: false
    left:
      - href: index.qmd
        text: Home
      - text: Science
        menu:
          - href: inflation.qmd
            text: The first instant
          - href: structure.qmd
            text: How structure grew
      - text: Tech
        menu:
          - href: smurf.qmd
            text: SMuRF
          - href: devices.qmd
            text: Devices
      - href: group.qmd
        text: Group
      - text: Papers and talks
        menu:
          - href: publications.qmd
            text: Publications
          - href: outreach.qmd
            text: Talks and outreach
      - href: about.qmd
        text: About
  open-graph: true
  twitter-card: true
  page-footer:
    left: |
      Zeeshan Ahmed · KIPAC, SLAC National Accelerator Laboratory and Stanford University ·
      [zeesh@slac.stanford.edu](mailto:zeesh@slac.stanford.edu)

      [Built with [Quarto](https://quarto.org) and [Claude](https://claude.ai).]{.colophon}

format:
