project:
  type: website
  output-dir: _site

website:
  title: "Zeeshan Ahmed"
  description: >-
    Zeeshan Ahmed builds ultra-low-noise superconducting detectors and the readout
    systems that make them usable at scale, and uses them to study the first instant
    of the Universe and the growth of cosmic structure.
  site-url: https://zeeshahmed.github.io
  favicon: images/favicon.svg
  navbar:
    title: "Zeeshan Ahmed"
    pinned: false
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: smurf.qmd
        text: SMuRF
      - href: devices.qmd
        text: Devices
      - href: group.qmd
        text: Group
      - href: publications.qmd
        text: Publications
      - href: outreach.qmd
        text: Talks
      - href: about.qmd
        text: About
  page-footer:
    left: |
      Zeeshan Ahmed · SLAC National Accelerator Laboratory and Stanford University ·
      [zeesh@slac.stanford.edu](mailto:zeesh@slac.stanford.edu)

